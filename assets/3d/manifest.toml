# Source and output hashes correspond to assets/3d/prepare.py.
# Generated GLBs are local, ignored build inputs and retain their source terms.

[[model]]
name = "Bunny"
file = "models/bunny.glb"
source_url = "https://graphics.stanford.edu/pub/3Dscanrep/bunny.tar.gz"
source_sha256 = "a5720bd96d158df403d153381b8411a727a1d73cff2f33dc9b212d6f75455b84"
converted_sha256 = "7ef98128f08102c1064efe7dd3a9fd9987528946224175a75f475691acacd9b7"
license = "Stanford 3D Scanning Repository research/non-commercial terms"
attribution = "Stanford Computer Graphics Laboratory"
conversion_command = "uv run assets/3d/prepare.py"
conversion = "Extract bunny/reconstruction/bun_zipper.ply and pack its indexed triangles into GLB without decimation."
scale_correction = "None; Stanford reconstruction coordinates are interpreted as meters"
orientation_correction = "None; source is +Y up"

